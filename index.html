<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Hero Section</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <section class="hero">
        <div class="container">
            <div class="hero-content">
                <h1 class="hero-title">შექმენი შენი <span>ციფრული მომავალი</span></h1>
                <p class="hero-description">აღმოაჩინე ინოვაციური პლატფორმა, რომელიც გაგიმარტივებს სამუშაო პროცესს და გაზრდის პროდუქტიულობას. შექმნილია თანამედროვე გუნდებისთვის.</p>
                <div class="hero-buttons">
                    <button class="btn btn-primary" id="btn-get-started">Get Started</button>
                    <button class="btn btn-secondary" id="btn-learn-more">Learn More</button>
                </div>
            </div>
            <div class="hero-visual">
                <div class="visual-element">
                    <!-- აბსტრაქტული ფიგურები ვიზუალისთვის -->
                    <div class="shape shape-1"></div>
                    <div class="shape shape-2"></div>
                    <div class="shape shape-3"></div>
                </div>
            </div>
        </div>
    </section>
    
    <script src="script.js"></script>
</body>
</html>
